# Robolectric Configuración global.
#
# conscryptMode=OFF: Sólo uso BouncyCastle,Conscrypt no está instalado como proveedor de seguridad predeterminado.
# Razón:La JVM de prueba es compartida.,Robolectric La instalación de Conscrypt contamina las pruebas normales de cifrado JUnit
# (BackupCrypto / WebServerAuthPolicy / CloudBackupReadBack espera),Se muestra como
# javax.crypto.JarVerifier La inicialización falló:
#   SecurityException: Framework jar verification can not be initialized
#   caused by conscrypt ASN.1 DIGEST_AND_KEY_TYPE_NOT_SUPPORTED
# OFF El modo se acerca más al comportamiento del proveedor de seguridad de los dispositivos Android reales.,No afecta las funciones propias de Robolectric.
conscryptMode=OFF
