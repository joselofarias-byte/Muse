name: CI

# CI Sólo se permiten entradas reproducibles: control de acceso de calidad, prueba única/paquete de depuración,tag Construcción y lanzamiento oficiales.
# Todos los pasos de ejecución utilizan PowerShell 7 para evitar inconsistencias entre la semántica del shell CI y nativa de Windows.
defaults:
  run:
    shell: pwsh

concurrency:
  group: muse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Compilación Android verificable en la rama y en el PR: JDK, SDK, caché de Gradle,
  # comprobaciones, pruebas unitarias y assembleDebug, con el APK de depuración como artefacto.
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # v2.1.0: 45→75 — v2.0.0 Al publicar, simultaneidad de doble inserción principal+etiqueta, superposición de compilación completa,Se levantó el límite de 45 minutos.
    timeout-minutes: 75
    env:
      ORG_GRADLE_PROJECT_museLite: ${{ github.head_ref == 'feature/muse-android-lite-es' || github.ref == 'refs/heads/feature/muse-android-lite-es' || github.head_ref == 'integration/muse-lite-upstream' || github.ref == 'refs/heads/integration/muse-lite-upstream' || github.base_ref == 'feature/muse-android-lite-es' || startsWith(github.ref, 'refs/heads/integration/muse-lite-replay-') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` SDK package was removed from current runners.
          # v2.2.x: Requisitos para construir la biblioteca nativa PTY del terminal NDK + CMake(autoescrito forkpty JNI)
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # P4-9: Consume la salida de carriles de pr_check — Documentación pura/Otros RP ya no activan compilaciones completas de Android.
      # push/tag/schedule Porque es imposible comparar PR base,Siempre lleno.
      - name: Compute affected lanes (PR path filtering)
        id: lanes
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys
          base = os.environ.get('GITHUB_BASE_REF')
          if base:
              out = subprocess.run(
                  ['python3', 'ci/script/pr_check.py', '--base', 'origin/' + base, '--output', 'json'],
                  capture_output=True, text=True, check=True,
              ).stdout
              scopes = set(json.loads(out).get('scopes', []))
          else:
              scopes = {'android_jvm', 'android_full', 'android_resources', 'script', 'localization', 'config'}
          heavy = bool(scopes & {'android_jvm', 'android_full', 'android_resources', 'script'})
          # Lite PR must exercise Gradle even when only the workflow changed.
          if os.environ.get('ORG_GRADLE_PROJECT_museLite') == 'true':
              heavy = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"run_full={'true' if heavy else 'false'}\n")
              f.write('scopes=' + ','.join(sorted(scopes)) + '\n')
          print(f"affected scopes: {sorted(scopes)} run_full={heavy}")
          PYEOF
      - name: Build Web Host UI assets
        if: steps.lanes.outputs.run_full == 'true'
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Pack embedded runtimes (Node + Python)
        # Lite experiment: test whether Android can build without bundled interpreters.
        if: steps.lanes.outputs.run_full == 'true' && env.ORG_GRADLE_PROJECT_museLite != 'true'
        run: |
          sudo apt-get install -y patchelf
          bash tools/runtime-pack/build-runtime-pack.sh both
          if ($LASTEXITCODE -ne 0) { throw "runtime-pack failed: $LASTEXITCODE" }
          bash tools/python-pack/build-python-pack.sh both
          if ($LASTEXITCODE -ne 0) { throw "python-pack failed: $LASTEXITCODE" }
          if (-not (Test-Path 'app/src/main/jniLibs/arm64-v8a/libmuse_node.so')) { throw 'runtime-pack Salida faltante: libmuse_node.so' }
          if (-not (Test-Path 'app/src/main/jniLibs/arm64-v8a/libpython3.14.so')) { throw 'python-pack Salida faltante: libpython3.14.so' }
          if (-not (Test-Path 'app/src/main/assets/muse-runtime-assets.zip')) { throw 'runtime-pack Salida faltante: muse-runtime-assets.zip' }
          if (-not (Test-Path 'app/src/main/assets/muse-python-assets.zip')) { throw 'python-pack Salida faltante: muse-python-assets.zip' }
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Gradle cache
        if: steps.lanes.outputs.run_full == 'true'
        uses: gradle/actions/setup-gradle@v6
      - name: Lite integration boundaries
        if: env.ORG_GRADLE_PROJECT_museLite == 'true'
        run: |
          python3 ci/script/check_lite_integration.py
          python3 ci/test/test_lite_integration.py
      - name: CI script tests
        run: ./ci/run_ci_checks.ps1 -Lane ci-scripts
      - name: Lane checks
        env:
          PR_CHECK_SCOPES: ${{ steps.lanes.outputs.scopes }}
        run: ./ci/run_ci_checks.ps1 -Lane lanes -ChangedScopes "$env:PR_CHECK_SCOPES"
      - name: Static checks
        if: steps.lanes.outputs.run_full == 'true'
        # Detekt baseline Actualizado y confirmado por local :module:detektBaseline;CI No cambie automáticamente el almacén.
        # De esta manera, los nuevos problemas fallarán y los problemas históricos aún se registrarán claramente en la línea base del módulo correspondiente.
        run: ./ci/run_ci_checks.ps1 -Lane static
      - name: Unit tests (app/memory/ai)
        if: steps.lanes.outputs.run_full == 'true'
        run: ./ci/run_ci_checks.ps1 -Lane unit
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests
            memory/build/reports/tests
            ai/build/reports/tests
          if-no-files-found: ignore
      - name: Migration coverage check
        if: steps.lanes.outputs.run_full == 'true'
        run: python3 ci/script/check_migration_coverage.py
      # CMP-11 / I18N-02 barandilla: Inspección de segundo nivel de guión puro,Ejecutar incondicionalmente(No afectado por la ruta run_full,
      # doc-only PR también interceptar).static lane(ci/run_ci_checks.ps1)Ejecutará el mismo par de scripts nuevamente.,
      # garantia `run_ci_checks.ps1 -Lane static` La reproducción local es consistente con CI.;listado explícitamente aquí
      # Esto es para que la página de CI pueda localizar directamente los elementos fallidos.
      - name: Component convergence guard (CMP-11)
        run: python3 ci/script/check_component_convergence.py
      - name: Translation residue guard (I18N-02)
        run: python3 ci/script/check_translation_residue.py
      - name: Font scale clipping guard (A11Y-03)
        run: python3 ci/script/check_font_scale_clipping.py
      - name: Horizontal inset guard (UI-LAYOUT)
        run: python3 ci/script/check_horizontal_inset.py
      - name: Build debug APK
        if: steps.lanes.outputs.run_full == 'true'
        run: ./ci/run_ci_checks.ps1 -Lane debug
      - name: Verify debug APKs
        if: steps.lanes.outputs.run_full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          for apk in app/build/outputs/apk/debug/*.apk; do
            unzip -t "$apk" >/dev/null
            "$tools/apksigner" verify --verbose "$apk"
            "$tools/zipalign" -c -P 16 -v 4 "$apk"
            "$tools/aapt" dump badging "$apk" > "$apk.badging.txt"
            "$tools/aapt2" dump resources "$apk" > "$apk.resources.txt"
            grep -q "package: name='io.zer0.muse'" "$apk.badging.txt"
            grep -q "targetSdkVersion:'36'" "$apk.badging.txt"
            grep -q 'Mantenga presionado el texto para seleccionar y copiar' "$apk.resources.txt"
            grep -q 'Long press the text to select and copy it' "$apk.resources.txt"
            grep -q 'network_security_config' "$apk.resources.txt"
            if [[ "$ORG_GRADLE_PROJECT_museLite" == true ]]; then
              unzip -Z1 "$apk" > "$apk.entries.txt"
              if grep -Eq '(^assets/muse-(runtime|python)-assets.zip$|/lib(muse_node|muse_python|python3[^/]*)\.so$)' "$apk.entries.txt"; then
                echo "Unexpected bundled runtime in Lite APK: $apk" >&2
                exit 1
              fi
            fi
          done
          test -s app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          grep -q "native-code:.*'arm64-v8a'" app/build/outputs/apk/debug/app-arm64-v8a-debug.apk.badging.txt
          if [[ "$ORG_GRADLE_PROJECT_museLite" == true ]]; then
            mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk')
            test "${#apks[@]}" -eq 1
            grep -q "^native-code: 'arm64-v8a'$" app/build/outputs/apk/debug/app-arm64-v8a-debug.apk.badging.txt
          fi
          cd app/build/outputs/apk/debug
          printf '{"commit":"%s","repository":"%s","lite":%s,"abi":"arm64-v8a","buildType":"debug","runId":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$ORG_GRADLE_PROJECT_museLite" "$GITHUB_RUN_ID" > build-metadata.json
          sha256sum app-arm64-v8a-debug.apk > SHA256SUMS
          stat --printf='%n %s bytes\n' app-arm64-v8a-debug.apk > APK-SIZES.txt
      - name: Upload debug APK
        if: steps.lanes.outputs.run_full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: muse-lite-arm64
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/APK-SIZES.txt
            app/build/outputs/apk/debug/build-metadata.json
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk.badging.txt
          retention-days: 30
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports
            build/reports/kover
          if-no-files-found: ignore

  android-test:
    # P4-3: instrumented Anteriormente, la prueba solo se ejecutaba manualmente con flujo de trabajo_dispatch.,nightly Nunca ejecutado.
    # ahora schedule(Misma frecuencia que el cron nocturno anterior)también desencadenar emulator smoke,Todavía se puede activar manualmente.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v2.2.x: Requisitos para construir la biblioteca nativa PTY del terminal NDK + CMake
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v2.2.x: Requisitos para construir la biblioteca nativa PTY del terminal NDK + CMake
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Web Host UI assets
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Pack embedded runtimes (Node + Python)
        run: |
          sudo apt-get install -y patchelf
          bash tools/runtime-pack/build-runtime-pack.sh both
          if ($LASTEXITCODE -ne 0) { throw "runtime-pack failed: $LASTEXITCODE" }
          bash tools/python-pack/build-python-pack.sh both
          if ($LASTEXITCODE -ne 0) { throw "python-pack failed: $LASTEXITCODE" }
          if (-not (Test-Path 'app/src/main/jniLibs/arm64-v8a/libmuse_node.so')) { throw 'runtime-pack Salida faltante: libmuse_node.so' }
          if (-not (Test-Path 'app/src/main/jniLibs/arm64-v8a/libpython3.14.so')) { throw 'python-pack Salida faltante: libpython3.14.so' }
          if (-not (Test-Path 'app/src/main/assets/muse-runtime-assets.zip')) { throw 'runtime-pack Salida faltante: muse-runtime-assets.zip' }
          if (-not (Test-Path 'app/src/main/assets/muse-python-assets.zip')) { throw 'python-pack Salida faltante: muse-python-assets.zip' }
      - name: Grant execute permission for gradlew
        run: |
          $path = (Resolve-Path './gradlew').Path
          [System.IO.File]::SetUnixFileMode(
            $path,
            [System.IO.UnixFileMode]::UserRead -bor
              [System.IO.UnixFileMode]::UserWrite -bor
              [System.IO.UnixFileMode]::UserExecute -bor
              [System.IO.UnixFileMode]::GroupRead -bor
              [System.IO.UnixFileMode]::GroupExecute -bor
              [System.IO.UnixFileMode]::OtherRead -bor
              [System.IO.UnixFileMode]::OtherExecute
          )
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Resolve and validate release version
        id: version
        run: python3 ci/script/resolve_release_version.py --tag "$env:GITHUB_REF_NAME" --gradle-file app/build.gradle.kts --github-output "$env:GITHUB_OUTPUT"
      - name: Restore and validate signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 ci/script/validate_release_signing.py --keystore-out ./keystore.jks --properties-out ./keystore.properties
      - name: Build release APKs
        run: ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.version_name }}" -PversionCode="${{ steps.version.outputs.version_code }}"
      - name: Verify release APK signatures
        run: python3 ci/script/validate_release_apks.py --apk 'app/build/outputs/apk/release/*.apk'
      - name: Generate release manifest
        run: |
          $releaseApkDirectory = 'app/build/outputs/apk/release'
          $releaseApkMappings = @(
            @{ Source = 'app-arm64-v8a-release.apk'; Architecture = 'arm64-v8a' },
            @{ Source = 'app-armeabi-v7a-release.apk'; Architecture = 'armeabi-v7a' },
            @{ Source = 'app-universal-release.apk'; Architecture = 'universal' }
          )
          $apkArgs = @()
          $releaseAssetDirectory = 'release'
          New-Item -ItemType Directory -Path $releaseAssetDirectory -Force | Out-Null
          foreach ($mapping in $releaseApkMappings) {
            $sourcePath = Join-Path $releaseApkDirectory $mapping.Source
            if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) { throw "missing release APK: $($mapping.Source)" }
            $assetName = "Muse_$($env:GITHUB_REF_NAME)_$($mapping.Architecture).apk"
            $assetPath = Join-Path $releaseAssetDirectory $assetName
            Copy-Item -LiteralPath $sourcePath -Destination $assetPath -Force
            $apkArgs += @('--apk', $assetPath)
          }
          python3 ci/script/generate_release_manifest.py `
            --version-name "${{ steps.version.outputs.version_name }}" `
            --version-code "${{ steps.version.outputs.version_code }}" `
            $apkArgs `
            --db-file app/src/main/java/io/zer0/muse/data/session/MuseDb.kt `
            --release-notes "releases/$env:GITHUB_REF_NAME/release_body.md" `
            --commit-sha "$env:GITHUB_SHA" `
            --source-ref "$env:GITHUB_REF_NAME" `
            --out release/manifest.json
          python3 ci/script/validate_release_manifest.py `
            --manifest release/manifest.json `
            $apkArgs `
            --db-file app/src/main/java/io/zer0/muse/data/session/MuseDb.kt `
            --tag "$env:GITHUB_REF_NAME" `
            --commit-sha "$env:GITHUB_SHA"
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: |
            release/Muse_*.apk
            release/manifest.json
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ci/script/publish_release.py `
            --tag "$env:GITHUB_REF_NAME" `
            --body-file "releases/$env:GITHUB_REF_NAME/release_body.md" `
            --artifacts 'release/Muse_*.apk' `
            --artifacts 'release/manifest.json'
