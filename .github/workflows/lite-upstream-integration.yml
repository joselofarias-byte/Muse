name: Muse Lite - upstream selective integration
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/lite-upstream-integration.yml
permissions:
  contents: write
  pull-requests: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/muse-android-lite-es
          fetch-depth: 0
          persist-credentials: true
      - name: Cherry-pick reviewed upstream improvements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/Zer0Qing/Muse.git
          git fetch upstream main
          git switch -c integration/muse-lite-upstream
          # Oldest to newest: FTS5 stability, theme, auxiliary model diagnostics,
          # channel relay, proactive settings, memory, Safe Mode, Chinese UI strings.
          commits=(
            b6b68306
            6d393fd2
            9ebc4c2d
            037ce8a4
            456fabeb
            82efe6a5
            390f9d0c
            47a72195
          )
          for prefix in "${commits[@]}"; do
            sha="$(git rev-parse "upstream/main^{commit}")"
            match="$(git rev-list upstream/main | grep "^${prefix}" | head -1 || true)"
            if [[ -z "$match" ]]; then
              echo "::error::Upstream commit not found: $prefix"
              exit 1
            fi
            echo "Applying $match"
            if ! git cherry-pick -x "$match"; then
              echo "::error::Conflict at $prefix; no automatic conflict resolution"
              git status --short
              exit 1
            fi
          done
          # Do not permit upstream updater configuration to overwrite JolufaSoft routes.
          grep -q 'const val DEFAULT_REPO = "joselofarias-byte/Muse"' app/src/main/java/io/zer0/muse/update/UpdateChecker.kt
          grep -q 'https://github.com/joselofarias-byte/Muse/releases/latest' app/src/main/java/io/zer0/muse/update/UpdateNotifier.kt
          grep -q 'name: muse-lite-arm64' .github/workflows/ci.yml
          git push origin HEAD:refs/heads/integration/muse-lite-upstream
      - name: Open integration pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head integration/muse-lite-upstream --base feature/muse-android-lite-es --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create --draft --base feature/muse-android-lite-es --head integration/muse-lite-upstream --title 'Integrate selected upstream fixes into Muse Lite' --body 'Selective upstream cherry-picks for stability, memory, theme, assistant routing, channels and proactive features. Keep JolufaSoft update endpoints, Spanish localization and ARM64-only CI artifact. Requires CI and device validation before merging.'
          fi
