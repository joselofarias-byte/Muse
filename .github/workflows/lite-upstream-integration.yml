name: Muse Lite - upstream selective integration
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA of the reviewed integration revision already published on integration/muse-lite-upstream
        required: true
        type: string
  push:
    branches: [integration/muse-lite-upstream]
    paths:
      - .github/workflows/lite-upstream-integration.yml
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: muse-lite-integration-review
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed integration revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git fetch origin feature/muse-android-lite-es integration/muse-lite-upstream
          test "$(git rev-parse origin/integration/muse-lite-upstream)" = "$REVIEWED_SHA"
          git merge-base --is-ancestor origin/feature/muse-android-lite-es HEAD
          # Conflicts are resolved and reviewed in this revision, never hidden by --ours/--theirs.
          git diff --check origin/feature/muse-android-lite-es...HEAD
          python3 ci/script/check_lite_integration.py
      - name: Open integration pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Recheck immediately before creating the PR; this workflow never writes branches.
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/integration/muse-lite-upstream --jq .object.sha)" = "$REVIEWED_SHA"
          existing="$(gh pr list --head integration/muse-lite-upstream --base feature/muse-android-lite-es --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh pr create --draft --base feature/muse-android-lite-es --head integration/muse-lite-upstream --title 'Integrate selected upstream fixes into Muse Lite' --body "Reviewed integration revision: $REVIEWED_SHA. Semantic conflict resolutions are committed in this branch; no automatic cherry-picks or branch overwrites. Preserve JolufaSoft updates, Spanish localization and a single ARM64 APK. CI and device validation are required before merging."
          fi
