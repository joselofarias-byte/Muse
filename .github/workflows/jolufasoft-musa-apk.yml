name: JolufaSoft Musa APK release (es)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/jolufasoft-musa-apk.yml
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Spanish translation
        uses: actions/checkout@v4
        with:
          ref: cursor/spanish-default-locale-f884
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare embedded assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -f web/package-lock.json ]; then
            (cd web && npm ci && npm run build)
          fi
          if [ -f ci/script/pack_embedded_runtimes.py ]; then
            python3 ci/script/pack_embedded_runtimes.py
          fi
      - name: Create isolated release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/musa-release.jks" -storetype PKCS12 -alias musa -keyalg RSA -keysize 3072 -validity 3650 -storepass "MusaCI2026Temporary" -keypass "MusaCI2026Temporary" -dname "CN=Musa CI, OU=JolufaSoft, O=JolufaSoft, C=UY"
          printf 'storeFile=%s\\nstorePassword=%s\\nkeyAlias=musa\\nkeyPassword=%s\\n' "$RUNNER_TEMP/musa-release.jks" "MusaCI2026Temporary" "MusaCI2026Temporary" > keystore.properties
      - name: Assemble release APK without LeakCanary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon -PversionCode=266 -PversionName=2.6.6-musa-es
          find app/build/outputs/apk/release -name '*.apk' -type f -size +1M -print
      - name: Publish prerelease without Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -type f -size +1M | head -n 1)"
          test -n "$apk"
          cp "$apk" Musa-es-release-test.apk
          sha256sum Musa-es-debug.apk > SHA256SUMS.txt
          tag="musa-es-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Musa-es-debug.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Musa español release de prueba - build ${GITHUB_RUN_ID}" \
            --notes "APK release sin LeakCanary, rama cursor/spanish-default-locale-f884. Firma temporal de CI: requiere desinstalar antes de actualizar y no debe usarse como firma de producción." \
            --prerelease
          echo "### APK Musa" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
