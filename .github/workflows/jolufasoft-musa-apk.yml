name: JolufaSoft Musa APK release (es)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/jolufasoft-musa-apk.yml
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1
      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare embedded web assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -f web/package-lock.json ]; then
            (cd web && npm ci && npm run build)
          fi
      - name: Create isolated release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/musa-release.jks" -storetype PKCS12 -alias musa -keyalg RSA -keysize 3072 -validity 3650 -storepass "MusaCI2026Temporary" -keypass "MusaCI2026Temporary" -dname "CN=Musa CI, OU=JolufaSoft, O=JolufaSoft, C=UY"
          {
            echo "storeFile=$RUNNER_TEMP/musa-release.jks"
            echo "storePassword=MusaCI2026Temporary"
            echo "keyAlias=musa"
            echo "keyPassword=MusaCI2026Temporary"
          } > keystore.properties
      - name: Assemble Spanish debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon -PversionCode=266 -PversionName=2.6.6-musa-es
          find app/build/outputs/apk -name '*.apk' -type f -size +1M -print
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: musa-es-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: musa-es-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          debug="$(find app/build/outputs/apk/debug -name '*.apk' -type f -size +1M | head -n 1)"
          release="$(find app/build/outputs/apk/release -name '*.apk' -type f -size +1M | head -n 1)"
          test -n "$debug"
          test -n "$release"
          cp "$debug" Musa-es-debug.apk
          cp "$release" Musa-es-release.apk
          sha256sum Musa-es-debug.apk Musa-es-release.apk > SHA256SUMS.txt
          tag="musa-es-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" Musa-es-debug.apk Musa-es-release.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Musa español - build ${GITHUB_RUN_ID}" \
            --notes "APK de depuración y APK release de prueba en español. La firma de release es temporal de CI: hay que desinstalar antes de actualizar y no sirve como firma de producción." \
            --prerelease
          echo "### APK Musa" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
