# Gradle JVM Configuración
# v1.202: in-process La compilación requiere un montón más grande(independencia alternativa Kotlin daemon,Evite las restricciones de acceso a archivos sandbox)
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# org.gradle.java.home=C\:/Program Files/Java/jdk-21.0.12 (local only, CI uses setup-java)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android Configuración
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Kotlin Configuración
kotlin.code.style=official
# v1.202: Restaurar la compilación incremental en el entorno local; usar useClasspathSnapshot=false Evitar el problema de verificación MD5 de la instantánea de clase en el entorno limitado de CI
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=false
# v1.202: Utilice una estrategia de compilación en proceso en su lugar,Evite que el demonio de Kotlin muera en sandbox después de bifurcarse(exit code -1)
# in-process En modo, el compilador Kotlin se ejecuta dentro de Gradle JVM,No bifurque procesos independientes
kotlin.compiler.execution.strategy=in-process
# Kotlin Compilar la memoria del demonio(in-process Este elemento se ignora en el modo,Reservado para el respaldo del modo demonio)
kotlin.daemon.jvmargs=-Xmx6g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# KSP
ksp.useKSP2=true

android.overridePathCheck=true