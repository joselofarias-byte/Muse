# detekt Configuración de análisis estático
build:
  maxIssues: 0

complexity:
  # El umbral se establece en función de la "legibilidad" y no de "números pequeños".
  # Una función Redactar contenido es naturalmente larga: describe la estructura de la interfaz y solo se puede dividir en siete u ocho partes.
  # Después de una subfunción, el lector tiene que saltar repetidamente para deletrear el árbol completo, lo cual es más difícil de entender que una función larga.
  LongMethod:
    active: true
    threshold: 120

  # Las áreas más afectadas con muchos parámetros son las clases de datos y los constructores, que originalmente describen "qué campos hay".
  # 8 Puedes recordar el orden por nombre si tienes menos de uno. Si hay más de uno, debe cambiar a objetos con nombre.
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10

  # Las ramas que caben en una pantalla son más fáciles de leer que la extracción forzada de funciones. Más de 20 normalmente indica que se debe romper la lógica.
  CyclomaticComplexMethod:
    active: true
    threshold: 20

  ComplexCondition:
    active: true
    threshold: 6

  NestedBlockDepth:
    active: true
    threshold: 5

  # Los archivos grandes en este proyecto son principalmente ViewModel y el ensamblaje del sistema, que son todos "una responsabilidad, muchos detalles".
  LargeClass:
    active: true
    threshold: 900

  TooManyFunctions:
    active: true
    thresholdInClasses: 18
    thresholdInInterfaces: 15
    thresholdInObjects: 18
    thresholdInFiles: 30

style:
  # Regresar temprano es una forma de aplanar el código, no un mal olor. El verdadero problema es el anidamiento,
  # NestedBlockDepth gestiona por separado el anidamiento de este almacén.
  ReturnCount:
    active: true
    max: 4
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    # El español ocupa más que el chino. 140 corta miles de comentarios y literales ya traducidos.
    # Se mantiene el tope alto para no reintroducir esa deuda, y los comentarios no cuentan.
    maxLineLength: 4000
    excludeCommentStatements: true
  UnusedImports:
    active: true
  TrailingWhitespace:
    active: true

potential-bugs:
  UnreachableCode:
    active: true

performance:
  CouldBeSequence:
    active: true

naming:
  active: true
  # v2.6.7: Informe también a detekt sobre la convención de nomenclatura de Compose.
  #
  # Antecedentes: se ha configurado root .editorconfig `ktlint_function_naming_ignore_when_annotated_with = Composable`,
  # Pero eso sólo funciona para ktlint. —— detekt Esta clave de .editorconfig no se lee.
  # El resultado es que FunctionNaming descubrió que PascalCase de 600 funciones @Composable infringía el código.
  # Se queda en la línea de base durante mucho tiempo y actúa como ruido (no es un problema real y encubre el problema real).
  #
  # Esta es la coherencia de la cadena de herramientas de finalización, no una relajación de las reglas: las funciones normales aún requieren una pequeña carcasa de camello,
  # Solo las funciones de composición anotadas con @Composable permiten PascalCase mediante la convención Compose.
  FunctionNaming:
    active: true
    ignoreAnnotated:
      - 'Composable'

exceptions:
  active: true

empty-blocks:
  active: true